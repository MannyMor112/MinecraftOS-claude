# MinecraftOS @VERSION@ - internal drive boot menu (legacy BIOS and UEFI)
search --no-floppy --fs-uuid --set=root @ROOTUUID@
set timeout=5
set default=0
terminal_output console
set COMMON="root=UUID=@ROOTUUID@ rw quiet loglevel=3 systemd.show_status=false nowatchdog nmi_watchdog=0 i915.fastboot=1"
set FAST="mitigations=off"

menuentry "Play Minecraft" {
  linux /boot/vmlinuz-@KLTS@ $COMMON $FAST mcos.mode=play
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Benchmark: one run (~4 min)" {
  linux /boot/vmlinuz-@KLTS@ $COMMON $FAST mcos.mode=bench
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Benchmark suite: quick (8 runs, ~35 min)" {
  linux /boot/vmlinuz-@KLTS@ $COMMON $FAST mcos.mode=suite mcos.repeats=1
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Benchmark suite: full (16 runs, ~70 min)" {
  linux /boot/vmlinuz-@KLTS@ $COMMON $FAST mcos.mode=suite mcos.repeats=2
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Benchmark: one run, CPU security mitigations ON" {
  linux /boot/vmlinuz-@KLTS@ $COMMON mcos.mode=bench
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Benchmark: one run, newer kernel @KNEW@" {
  linux /boot/vmlinuz-@KNEW@ $COMMON $FAST mcos.mode=bench
  initrd /boot/initrd.img-@KNEW@
}
menuentry "Play Minecraft, newer kernel @KNEW@" {
  linux /boot/vmlinuz-@KNEW@ $COMMON $FAST mcos.mode=play
  initrd /boot/initrd.img-@KNEW@
}
menuentry "Setup & tools menu (Wi-Fi, sign-in, backup saves, install)" {
  linux /boot/vmlinuz-@KLTS@ $COMMON $FAST mcos.mode=menu
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Safe mode (no tuning, verbose boot, mitigations on)" {
  linux /boot/vmlinuz-@KLTS@ root=UUID=@ROOTUUID@ rw mcos.mode=menu mcos.gov=powersave
  initrd /boot/initrd.img-@KLTS@
}
menuentry "Safe mode without graphics driver (text only: backup / install / shell)" {
  linux /boot/vmlinuz-@KLTS@ root=UUID=@ROOTUUID@ rw nomodeset mcos.mode=menu
  initrd /boot/initrd.img-@KLTS@
}
