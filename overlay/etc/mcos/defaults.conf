# MinecraftOS v1 defaults. Override any of these in /data/mcos.conf (persistent, on the USB stick).
# Java heap (MiB). Baseline on Lubuntu: -Xmx1G.
HEAP_MB=1024
# JVM flags: the official launcher's G1 flags (what the Lubuntu baseline most likely used).
JVM_FLAGS="-XX:+UnlockExperimentalVMOptions -XX:+UseG1GC -XX:G1NewSizePercent=20 -XX:G1ReservePercent=20 -XX:MaxGCPauseMillis=50 -XX:G1HeapRegionSize=16M -XX:+DisableExplicitGC"
# Mesa / GL environment for the game. vblank_mode=0: never wait for vsync in the driver.
GL_ENV="vblank_mode=0"
# Window manager while the game runs: openbox (robust for launcher dialogs) or none
GAME_WM=openbox
