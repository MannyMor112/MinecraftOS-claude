# Chromebook top row (sends F1..F10 under Linux). Minecraft does not use F6/F7/F9/F10.
KEY_F6      1   /usr/local/bin/mcos-brightness down
KEY_F6      2   /usr/local/bin/mcos-brightness down
KEY_F7      1   /usr/local/bin/mcos-brightness up
KEY_F7      2   /usr/local/bin/mcos-brightness up
KEY_F9      1   /usr/local/bin/mcos-volume down
KEY_F9      2   /usr/local/bin/mcos-volume down
KEY_F10     1   /usr/local/bin/mcos-volume up
KEY_F10     2   /usr/local/bin/mcos-volume up
# F8 is "smooth camera" in Minecraft, so mute is Search+F8
KEY_F8+KEY_LEFTMETA  1   /usr/local/bin/mcos-volume mute
# dedicated brightness/volume keys, in case the keyboard reports them as such
KEY_BRIGHTNESSDOWN 1 /usr/local/bin/mcos-brightness down
KEY_BRIGHTNESSUP   1 /usr/local/bin/mcos-brightness up
KEY_VOLUMEDOWN     1 /usr/local/bin/mcos-volume down
KEY_VOLUMEUP       1 /usr/local/bin/mcos-volume up
KEY_MUTE           1 /usr/local/bin/mcos-volume mute
